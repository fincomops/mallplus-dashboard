<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinCom — Internal Portals</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.cdnfonts.com/css/garet" rel="stylesheet"/>
<style>
:root {
  --blue:     #2F1AE5;
  --dark:     #1A1035;
  --gray:     #6B7280;
  --dimlt:    #A0AEC0;
  --teal:     #00AFA0;
  --teal-dk:  #007A73;
  --teal-lt:  #E0F5F3;
  --red:      #EF4444;
  --red-lt:   #FEE2E2;
  --amber:    #F59E0B;
  --card:     #FFFFFF;
  --border:   rgba(0,175,160,.13);
  --shadow-sm:0 2px 12px rgba(0,175,160,.10);
  --shadow-md:0 8px 32px rgba(0,175,160,.16);
  --font-title:  'Garet','Space Grotesk',sans-serif;
  --font-main:   'Space Grotesk',system-ui,sans-serif;
  --font-accent: 'Quicksand',sans-serif;
  --r-sm:12px; --r-md:20px; --r-lg:32px; --r-pill:999px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; }
body {
  font-family: var(--font-main);
  background: linear-gradient(135deg,#3724ED 0%,#1A9FD8 45%,#00AFA0 100%);
  background-attachment: fixed;
  color: var(--dark); min-height: 100vh;
}

/* ── Header ─────────────────────────────────────── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px;
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
  box-shadow: 0 2px 16px rgba(0,175,160,.08);
}
.header .brand { font-family: var(--font-title); font-size: 1.05rem; font-weight: 700; color: var(--dark); }
.header .brand span { color: var(--teal); }
.header-right { display: flex; align-items: center; gap: 12px; }
.user-pill {
  display: flex; align-items: center; gap: 8px;
  font-size: .78rem; color: var(--dark);
}
.user-pill .dept { color: var(--dimlt); font-size: .7rem; font-family: var(--font-accent); letter-spacing: 1.2px; text-transform: uppercase; }
.signout-btn {
  background: var(--teal-lt); color: var(--teal-dk);
  border: 1px solid rgba(0,175,160,.3);
  border-radius: var(--r-pill); padding: 6px 14px;
  font-family: var(--font-accent); font-size: .75rem; font-weight: 700;
  cursor: pointer; transition: background .2s;
  text-decoration: none;
}
.signout-btn:hover { background: #c8eee9; }

/* ── Compact greeting bar ───────────────────────── */
.hero-bar {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  max-width: 1280px; margin: 0 auto; padding: 22px 20px 6px;
}
.hero-bar h1 {
  font-family: var(--font-title); font-size: 1.55rem; font-weight: 700;
  color: #fff;
}
.hero-bar .greeting { font-family: var(--font-accent); font-size: .9rem; color: rgba(255,255,255,.88); }

/* ── 3-column layout ────────────────────────────── */
#portal-layout {
  display: flex; align-items: flex-start; gap: 20px;
  max-width: 1280px; margin: 0 auto; padding: 14px 20px 40px;
}
#portal-col  { flex: 0 0 280px; min-width: 0; }
#ann-col     { flex: 1 1 auto;  min-width: 0; }
#cal-sidebar { flex: 0 0 340px; position: sticky; top: 76px; }

/* ── Portal sidebar (white vertical strip, Aug 20 2026) ── */
.side-strip {
  background: rgba(255,255,255,.97);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: var(--r-md); box-shadow: var(--shadow-md);
  padding: 18px 14px 14px;
  position: sticky; top: 76px;
}
.strip-title {
  font-family: var(--font-title); font-size: .92rem; font-weight: 700;
  color: var(--dark); display: flex; align-items: center; gap: 8px;
  padding: 0 10px;
}
.strip-title span { color: var(--teal); }
.strip-sub {
  font-family: var(--font-accent); font-size: .62rem; color: var(--dimlt);
  text-transform: uppercase; letter-spacing: 1.6px; font-weight: 700;
  margin: 2px 10px 6px;
}
.nav-label {
  font-family: var(--font-accent); font-size: .6rem; font-weight: 800;
  letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--gray); margin: 16px 10px 5px;
}
.nav-label:first-of-type { margin-top: 8px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 12px;
  color: var(--dark); text-decoration: none;
  font-family: var(--font-accent); font-size: .84rem; font-weight: 600;
  transition: background .13s ease, color .13s ease;
}
.nav-item:hover { background: var(--teal-lt); color: var(--teal-dk); }
.nav-item .ic { font-size: 1rem; width: 22px; text-align: center; flex: 0 0 auto; }
.nav-item .nm { flex: 1 1 auto; }

/* ── Announcements (center) ─────────────────────── */
.panel {
  background: rgba(255,255,255,.97);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: var(--r-md); box-shadow: var(--shadow-md);
  padding: 20px 22px;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.panel-head h3 { font-family: var(--font-title); font-size: 1rem; font-weight: 700; color: var(--dark); }
.ann-item { padding: 14px 0; border-bottom: 1px dashed rgba(0,175,160,.22); }
.ann-item:last-child { border-bottom: none; padding-bottom: 4px; }
.ann-title { font-weight: 700; font-size: .95rem; display: flex; align-items: center; gap: 8px; color: var(--dark); }
.pin-badge {
  background: var(--amber); color: #fff; font-size: .56rem; font-weight: 800;
  letter-spacing: 1px; padding: 2px 8px; border-radius: 999px; text-transform: uppercase;
  flex: 0 0 auto;
}
.ann-meta { font-family: var(--font-accent); font-size: .7rem; color: var(--dimlt); margin-top: 3px; }
.ann-msg { font-size: .85rem; color: #374151; margin-top: 7px; white-space: pre-wrap; line-height: 1.55; }
.ann-img { max-width: 100%; max-height: 300px; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border); display: block; }
.ann-empty { font-family: var(--font-accent); font-size: .84rem; color: var(--dimlt); padding: 18px 0 8px; text-align: center; }
.ann-more { font-family: var(--font-accent); font-size: .74rem; color: var(--teal-dk); margin-top: 10px; font-weight: 700; }

/* ── Calendar sidebar (right) ───────────────────── */
.cal-card {
  background: rgba(255,255,255,.97);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: var(--r-md); box-shadow: var(--shadow-md);
  padding: 18px;
}
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head h3 { font-family: var(--font-title); font-size: 1rem; font-weight: 700; }
.cal-nav { display: flex; gap: 6px; }
.cal-nav button {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--teal-lt); color: var(--teal-dk); font-weight: 800; cursor: pointer;
  font-family: var(--font-main); font-size: .9rem; line-height: 1;
}
.cal-nav button:hover { background: #c8eee9; }
.cal-month { font-family: var(--font-accent); font-size: .8rem; font-weight: 700; color: var(--gray); text-align: center; margin-bottom: 10px; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
.cal-dow { text-align: center; font-size: .62rem; font-weight: 800; color: var(--dimlt); padding: 4px 0; font-family: var(--font-accent); }
.cal-day {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 9px; font-size: .76rem; cursor: pointer; position: relative;
  color: var(--dark); background: rgba(0,175,160,.05);
}
.cal-day:hover { background: var(--teal-lt); }
.cal-day.other-month { color: #C3CBD8; background: transparent; }
.cal-day.today { background: var(--teal); color: #fff; font-weight: 800; }
.cal-day.selected { outline: 2px solid var(--teal-dk); outline-offset: 1px; }
.cal-dots { display: flex; gap: 2px; margin-top: 2px; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; }
.cal-events { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
.cal-events h4 { font-family: var(--font-accent); font-size: .7rem; color: var(--gray); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
.cal-empty { font-family: var(--font-accent); font-size: .78rem; color: var(--dimlt); }
.cal-event { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; }
.cal-event .chip { flex: 0 0 auto; font-size: .56rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #fff; border-radius: 999px; padding: 2px 7px; margin-top: 1px; }
.ev-title { font-size: .8rem; font-weight: 700; color: var(--dark); }
.ev-notes { font-size: .72rem; color: var(--gray); }
.cal-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
.cal-legend span { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-accent); font-size: .66rem; font-weight: 700; color: var(--gray); }
.cal-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.foot { text-align: center; font-family: var(--font-accent); font-size: .72rem; color: rgba(255,255,255,.65); padding: 4px 0 30px; }

/* ── Login card ─────────────────────────────────── */
.login-wrap {
  min-height: calc(100vh - 60px);
  display: flex; align-items: center; justify-content: center;
  padding: 32px 20px;
}
.login-card {
  background: rgba(255,255,255,.97); border-radius: var(--r-lg);
  box-shadow: var(--shadow-md); border: 1px solid var(--border);
  padding: 40px 36px; width: 100%; max-width: 400px;
  text-align: center;
}
.login-card .lock { font-size: 2rem; margin-bottom: 8px; }
.login-card .co { font-family: var(--font-accent); font-size: .72rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--teal-dk); margin-bottom: 6px; }
.login-card h2 { font-family: var(--font-title); font-size: 1.5rem; margin-bottom: 4px; }
.login-card .sub { font-family: var(--font-accent); font-size: .82rem; color: var(--gray); margin-bottom: 22px; }
.login-card label { display: block; text-align: left; font-family: var(--font-accent); font-size: .7rem; font-weight: 700; color: var(--gray); margin: 14px 0 5px; text-transform: uppercase; letter-spacing: .8px; }
.login-card input {
  width: 100%; padding: 12px 14px; border: 1.5px solid #D5DEEA; border-radius: 12px;
  font-size: .92rem; font-family: var(--font-main); outline: none; background: #fff;
}
.login-card input:focus { border-color: var(--teal); }
.login-btn {
  margin-top: 22px; width: 100%; background: var(--teal); color: #fff;
  border: none; border-radius: var(--r-pill); padding: 13px; font-family: var(--font-accent);
  font-size: .9rem; font-weight: 700; cursor: pointer; transition: background .2s;
}
.login-btn:hover { background: var(--teal-dk); }
.login-btn:disabled { opacity: .55; cursor: default; }
.err-msg {
  display: none; margin-top: 14px; background: var(--red-lt); color: #C0392B;
  font-size: .8rem; padding: 10px 12px; border-radius: 10px; font-family: var(--font-accent);
}

/* ── Mobile: announcements → portals → calendar ─── */
@media (max-width: 1024px) {
  #portal-layout { flex-direction: column; }
  #portal-col  { flex: 1 1 auto; width: 100%; }
  #ann-col     { flex: 1 1 auto; width: 100%; order: -1; }
  #cal-sidebar { flex: 1 1 auto; width: 100%; position: static; }
  .hero-bar h1 { font-size: 1.35rem; }
}
</style>
</head>
<body>

<!-- ── Header ───────────────────────────────────── -->
<header class="header">
  <div class="brand">FinCom <span>Portals</span></div>
  <div class="header-right">
    <div class="user-pill" id="header-user" style="display:none">
      <span id="header-name" style="font-weight:600"></span>
      <span class="dept" id="header-dept"></span>
    </div>
    <a href="#" class="signout-btn" id="signout-btn" onclick="signOut(event)" style="display:none">Sign out</a>
  </div>
</header>

<!-- ── LOGIN VIEW ─────────────────────────────── -->
<div id="view-login">
  <div class="login-wrap">
    <div class="login-card">
      <div class="lock">🔑</div>
      <div class="co">FinCom Technologies Inc.</div>
      <h2>Sign In</h2>
      <div class="sub">Use your FinCom email and employee PIN</div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@fincom.asia" autocomplete="username email" required/>

        <label for="pin">PIN</label>
        <input type="password" id="pin" placeholder="••••" autocomplete="current-password" required/>

        <button class="login-btn" type="submit" id="login-btn">Sign In →</button>
        <div class="err-msg" id="err-msg"></div>
      </form>
    </div>
  </div>
</div>

<!-- ── PORTAL VIEW ────────────────────────────── -->
<div id="view-portal">
  <div class="hero-bar">
    <h1>Internal Portals</h1>
    <div class="greeting" id="greeting"></div>
  </div>

  <div id="portal-layout">
    <!-- Left: portal chips -->
    <div id="portal-col">
      <div id="tools-container"></div>
    </div>

    <!-- Center: company announcements -->
    <div id="ann-col">
      <div class="panel">
        <div class="panel-head">
          <h3>📣 Company Announcements</h3>
        </div>
        <div id="ann-list"><div class="ann-empty">Loading…</div></div>
      </div>
    </div>

    <!-- Right: team calendar -->
    <aside id="cal-sidebar">
      <div class="cal-card" id="cal-widget">
        <div class="cal-head">
          <h3>📅 Team Calendar</h3>
          <div class="cal-nav">
            <button type="button" onclick="calMove(-1)" title="Previous month">‹</button>
            <button type="button" onclick="calToday()" title="Jump to today">•</button>
            <button type="button" onclick="calMove(1)" title="Next month">›</button>
          </div>
        </div>
        <div class="cal-month" id="cal-month-label"></div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-events" id="cal-events"><h4>Events</h4><div class="cal-empty">Loading…</div></div>
        <div class="cal-legend">
          <span><i style="background:#EF4444"></i>Leave</span>
          <span><i style="background:#3B82F6"></i>WFH</span>
          <span><i style="background:#8B5CF6"></i>Meeting</span>
          <span><i style="background:#6B7280"></i>Other</span>
        </div>
      </div>
    </aside>
  </div>

  <div class="foot">FinCom Technologies Inc. · fcos.fincom.asia</div>
</div>

<script>
const TOKEN_KEY = 'fin_token';

/* ── Helpers ──────────────────────────────────── */
function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

function showErr(msg) {
  const el = document.getElementById('err-msg');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideErr() { document.getElementById('err-msg').style.display = 'none'; }

/* ── Login ───────────────────────────────────── */
async function handleLogin(e) {
  e.preventDefault();
  hideErr();
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  const email = document.getElementById('email').value.trim();
  const pin   = document.getElementById('pin').value.trim();

  try {
    const res = await fetch('/reimbursements/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, pin}),
    });
    const data = await res.json();
    if (!res.ok) {
      showErr(data.error || 'Sign-in failed. Check your email and PIN.');
      return;
    }
    setToken(data.token);
    await loadPortal();
  } catch(err) {
    showErr('Network error — please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In →';
  }
}

/* ── Sign out ─────────────────────────────────── */
async function signOut(e) {
  if (e) e.preventDefault();
  clearToken();
  // Clear portal cookies
  try { await fetch('/recon/logout', {credentials:'include', redirect:'manual'}); } catch(_) {}
  try { await fetch('/fs/logout',    {credentials:'include', redirect:'manual'}); } catch(_) {}
  try { await fetch('/board/logout', {credentials:'include', redirect:'manual'}); } catch(_) {}
  showLoginView();
}

/* ── Views ────────────────────────────────────── */
function showLoginView() {
  document.getElementById('view-login').style.display = 'flex';
  document.getElementById('view-portal').style.display = 'none';
  document.getElementById('header-user').style.display = 'none';
  document.getElementById('signout-btn').style.display = 'none';
}

function showPortalView(user, tools) {
  document.getElementById('view-login').style.display  = 'none';
  document.getElementById('view-portal').style.display = 'block';

  // Header
  document.getElementById('header-name').textContent = user.name;
  document.getElementById('header-dept').textContent = user.department;
  document.getElementById('header-user').style.display = 'flex';
  document.getElementById('signout-btn').style.display = 'inline-flex';

  // Greeting
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greeting').textContent = `${greet}, ${user.name.split(' ')[0]}!`;

  // Render tools as a vertical nav strip (white sidebar) grouped by category
  const categories = {};
  for (const tool of tools) {
    const cat = tool.category || 'Other';
    if (!categories[cat]) categories[cat] = [];
    categories[cat].push(tool);
  }

  const token = getToken();
  const container = document.getElementById('tools-container');
  container.className = 'side-strip';   // white vertical strip panel
  container.innerHTML = `
    <div class="strip-title">🧭 FinCom <span>Portals</span></div>
    <div class="strip-sub">Employee access</div>`;

  const catOrder = ['Finance', 'Ops', 'Reports', 'Admin'];
  const catKeys = [...new Set([...catOrder, ...Object.keys(categories)])];

  for (const cat of catKeys) {
    if (!categories[cat] || categories[cat].length === 0) continue;
    const label = document.createElement('div');
    label.className = 'nav-label';
    label.textContent = cat;
    container.appendChild(label);
    for (const tool of categories[cat]) {
      // Build deep link: recon + fs + board + announcements get ?token=
      let url = tool.url;
      if ((tool.id === 'recon' || tool.id === 'fs' || tool.id === 'board' || tool.id === 'announcements') && token) {
        url = tool.url + '?token=' + encodeURIComponent(token);
      }
      const a = document.createElement('a');
      a.className = 'nav-item';
      a.href = url;
      a.innerHTML = `<span class="ic">${tool.icon}</span><span class="nm">${escHtml(tool.name)}</span>`;
      container.appendChild(a);
    }
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Announcements (center column, Aug 20 2026) ── */
async function loadAnnouncements() {
  const token = getToken();
  const el = document.getElementById('ann-list');
  if (!token) return;
  try {
    const res = await fetch('/api/announcements', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) throw new Error('announcements fetch failed');
    const data = await res.json();
    const anns = (data.announcements || []).slice(0, 5);   // latest 5 (server sorts pinned first)
    if (!anns.length) {
      el.innerHTML = '<div class="ann-empty">No announcements yet</div>';
      return;
    }
    let html = '';
    for (const a of anns) {
      html += `<div class="ann-item">`;
      html += `<div class="ann-title">${a.pinned ? '<span class="pin-badge">📌 Pinned</span>' : ''}${escHtml(a.title)}</div>`;
      html += `<div class="ann-meta">${escHtml(a.date)}${a.author ? ' · ' + escHtml(a.author) : ''}</div>`;
      if (a.message) html += `<div class="ann-msg">${escHtml(a.message)}</div>`;
      if (a.image) html += `<img class="ann-img" src="${escHtml(a.image)}" alt="" loading="lazy" onerror="this.style.display='none'"/>`;
      html += `</div>`;
    }
    if (anns.length === 5) html += `<div class="ann-more">Showing latest 5</div>`;
    el.innerHTML = html;
  } catch(_) {
    el.innerHTML = '<div class="ann-empty">Announcements unavailable</div>';
  }
}

/* ── Load portal (after token exists) ─────────── */
async function loadPortal() {
  const token = getToken();
  if (!token) { showLoginView(); return; }

  try {
    const res = await fetch('/api/portal-tools', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (res.status === 401) {
      // Token expired or invalid
      clearToken();
      showLoginView();
      return;
    }
    if (!res.ok) throw new Error('tools fetch failed');
    const data = await res.json();
    showPortalView(data.user, data.tools);
    loadAnnouncements();   // fire-and-forget announcements widget
    loadCalendar();        // fire-and-forget calendar widget
  } catch(err) {
    // On error, show login
    clearToken();
    showLoginView();
  }
}

/* ── Calendar widget (sheet-driven, Aug 20 2026) ─ */
const CAL_TYPES = {
  leave:   { label: 'Leave',   color: '#EF4444' },
  wfh:     { label: 'WFH',     color: '#3B82F6' },
  meeting: { label: 'Meeting', color: '#8B5CF6' },
  other:   { label: 'Other',   color: '#6B7280' },
};
let calEvents = [];
let calView = null;      // {y, m} displayed month
let calSelected = null;  // 'YYYY-MM-DD'

function pad2(n){ return String(n).padStart(2,'0'); }
function keyFor(y, m, d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function eventsOn(key){ return calEvents.filter(e => e.date === key); }

async function loadCalendar() {
  const token = getToken();
  if (!token) return;
  try {
    const res = await fetch('/api/calendar', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) throw new Error('calendar fetch failed');
    const data = await res.json();
    calEvents = data.events || [];
  } catch(_) {
    calEvents = [];
  }
  const now = new Date();
  calView = { y: now.getFullYear(), m: now.getMonth() };
  calSelected = keyFor(now.getFullYear(), now.getMonth(), now.getDate());
  renderCalendar();
}

function calMove(delta) {
  if (!calView) return;
  let m = calView.m + delta, y = calView.y;
  if (m < 0) { m = 11; y--; }
  if (m > 11) { m = 0; y++; }
  calView = { y, m };
  renderCalendar();
}

function calToday() {
  const now = new Date();
  calView = { y: now.getFullYear(), m: now.getMonth() };
  calSelected = keyFor(now.getFullYear(), now.getMonth(), now.getDate());
  renderCalendar();
}

function calSelect(key) { calSelected = key; renderCalendar(); }

function renderCalendar() {
  if (!calView) return;
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const y = calView.y, m = calView.m;
  document.getElementById('cal-month-label').textContent = `${MONTHS[m]} ${y}`;
  const now = new Date();
  const todayKey = keyFor(now.getFullYear(), now.getMonth(), now.getDate());
  const gridStart = new Date(y, m, 1 - new Date(y, m, 1).getDay()); // Sunday-first

  let html = '';
  const dows = ['S','M','T','W','T','F','S'];
  for (const d of dows) html += `<div class="cal-dow">${d}</div>`;
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const key = keyFor(d.getFullYear(), d.getMonth(), d.getDate());
    const inMonth = d.getMonth() === m;
    const evs = eventsOn(key);
    const cls = ['cal-day'];
    if (!inMonth) cls.push('other-month');
    if (key === todayKey) cls.push('today');
    if (key === calSelected) cls.push('selected');
    let dots = '';
    if (evs.length) {
      dots = '<div class="cal-dots">' + evs.slice(0,3).map(e =>
        `<span class="cal-dot" style="background:${(CAL_TYPES[e.type]||CAL_TYPES.other).color}"></span>`
      ).join('') + '</div>';
    }
    const tip = evs.length ? escHtml(evs.map(e => e.title).join('; ')) : '';
    html += `<div class="${cls.join(' ')}" onclick="calSelect('${key}')" title="${tip}">${d.getDate()}${dots}</div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
  renderDayEvents();
}

function renderDayEvents() {
  const el = document.getElementById('cal-events');
  if (!calSelected) { el.innerHTML = '<h4>Events</h4><div class="cal-empty">Select a day</div>'; return; }
  const evs = eventsOn(calSelected);
  let html = `<h4>${calSelected}</h4>`;
  if (!evs.length) html += '<div class="cal-empty">No events</div>';
  for (const e of evs) {
    const t = CAL_TYPES[e.type] || CAL_TYPES.other;
    html += `<div class="cal-event"><span class="chip" style="background:${t.color}">${t.label}</span><div><div class="ev-title">${escHtml(e.title)}</div>${e.notes ? `<div class="ev-notes">${escHtml(e.notes)}</div>` : ''}</div></div>`;
  }
  el.innerHTML = html;
}

/* ── Bootstrap ───────────────────────────────── */
(function init() {
  if (getToken()) {
    loadPortal();
  } else {
    showLoginView();
  }
})();
</script>
